name = "pream"
version = "1.0.0"
description = "Ergonomic Gleam bindings for Preact with @preact/signals integration for fine-grained reactivity, shorthand HTML constructors, and Result/Option-aware rendering."
licences = ["MIT"]
target = "javascript"

gleam = ">= 1.14.0"

[repository]
type = "github"
user = "soulsam480"
repo = "pream"

links = [
  { title = "GitHub", href = "https://github.com/soulsam480/pream" },
]

[javascript]
typescript_declarations = true
source_maps = true

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
plinth = ">= 0.10.2 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
